# Publishes the Vite build to /docs so "Deploy from branch" Pages serves static files.
# Set Pages source to: Branch main, folder /docs
name: Publish docs for GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /YT-Transcript/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TRANSCRIPT_API: ${{ secrets.VITE_TRANSCRIPT_API }}

      - name: Copy dist to docs
        run: |
          rm -rf docs
          cp -r dist docs

      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(pages): update docs/ from Vite build'
          file_pattern: 'docs/**'
          skip_dirty_check: true
